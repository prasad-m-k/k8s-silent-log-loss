# Fluent Bit DaemonSet. DB.locking is false so logguard can read offsets.
# Rotate_Wait and Refresh_Interval are the values varied in the shipper-race runs.
apiVersion: v1
kind: ConfigMap
metadata: {name: fluent-bit-config, namespace: sll}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        HTTP_Server   On
        HTTP_Port     2020
        Parsers_File  /fluent-bit/etc/parsers.conf
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/loggen*_sll_app-*.log
        multiline.parser  cri
        DB                /var/log/flb_kube.db
        DB.locking        false
        Rotate_Wait       5
        Refresh_Interval  10
        Mem_Buf_Limit     50MB
        Buffer_Max_Size   1MB
    [INPUT]
        Name              tail
        Tag               escrow.*
        Path              /var/log/escrow-recovered/*.log
        multiline.parser  cri
        DB                /var/log/flb_escrow.db
    [OUTPUT]
        Name   http
        Match  *
        Host   receiver.sll.svc
        Port   8080
        URI    /ingest
        Format json_lines
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluent-bit, namespace: sll}
spec:
  selector: {matchLabels: {app: fluent-bit}}
  template:
    metadata: {labels: {app: fluent-bit}}
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.0
          resources:
            limits: {cpu: "500m", memory: 256Mi}
          volumeMounts:
            - {name: varlog, mountPath: /var/log}
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf}
      volumes:
        - name: varlog
          hostPath: {path: /var/log}
        - name: config
          configMap: {name: fluent-bit-config}
